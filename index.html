<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>摄影集 · Collections</title>
<style>
  :root {
    --bg: #0c0d10;
    --ink: #ececef;
    --muted: #8b8e97;
    --accent: #c9a15a;
    --line: rgba(255,255,255,0.1);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
    line-height: 1.6;
  }

  /* ---------- Hero ---------- */
  .hero {
    text-align: center;
    padding: clamp(4rem, 12vh, 8rem) 1.5rem 3rem;
  }

  .hero .kicker {
    font-size: 0.78rem;
    letter-spacing: 0.55em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 1.4rem;
  }

  .hero h1 {
    font-size: clamp(2.8rem, 9vw, 6rem);
    font-weight: 300;
    letter-spacing: 0.16em;
    line-height: 1.05;
  }

  .hero .sub {
    margin-top: 1.4rem;
    color: var(--muted);
    font-size: 0.95rem;
    letter-spacing: 0.3em;
  }

  .hero .rule {
    width: 60px;
    height: 1px;
    background: var(--accent);
    margin: 2rem auto 0;
  }

  /* ---------- Albums grid ---------- */
  .grid {
    max-width: 1180px;
    margin: 0 auto;
    padding: 2rem 1.5rem 5rem;
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 2.5rem;
  }

  @media (max-width: 720px) {
    .grid { grid-template-columns: 1fr; gap: 2rem; }
  }

  .card {
    display: block;
    text-decoration: none;
    color: inherit;
    opacity: 0;
    transform: translateY(36px);
    transition: opacity 0.8s ease, transform 0.8s ease;
  }

  .card.revealed { opacity: 1; transform: translateY(0); }

  .card .thumb {
    position: relative;
    aspect-ratio: 3 / 2;
    overflow: hidden;
    border-radius: 8px;
    background: #16181d;
  }

  .card .thumb img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: transform 0.7s ease, filter 0.7s ease;
  }

  .card:hover .thumb img { transform: scale(1.06); }

  .card .shade {
    position: absolute;
    inset: 0;
    background: linear-gradient(to top, rgba(12,13,16,0.75), transparent 55%);
    opacity: 0.6;
    transition: opacity 0.5s ease;
  }

  .card:hover .shade { opacity: 0.9; }

  .card .index {
    position: absolute;
    top: 1rem;
    left: 1.2rem;
    font-size: 0.8rem;
    letter-spacing: 0.2em;
    color: var(--accent);
  }

  .card .info {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    margin-top: 1rem;
  }

  .card h2 {
    font-size: 1.5rem;
    font-weight: 400;
    letter-spacing: 0.08em;
  }

  .card h2 em {
    font-style: normal;
    font-weight: 200;
    color: var(--muted);
  }

  .card .desc {
    margin-top: 0.3rem;
    color: var(--muted);
    font-size: 0.85rem;
    letter-spacing: 0.12em;
  }

  .card .enter {
    font-size: 0.85rem;
    letter-spacing: 0.1em;
    color: var(--muted);
    white-space: nowrap;
    transition: color 0.3s ease, transform 0.3s ease;
  }

  .card .enter .arrow { transition: transform 0.3s ease; }
  .card:hover .enter { color: var(--accent); }
  .card:hover .enter .arrow { transform: translateX(4px); }

  .card .meta {
    font-size: 0.75rem;
    letter-spacing: 0.15em;
    color: var(--muted);
    margin-top: 0.2rem;
  }

  /* ---------- placeholder card ---------- */
  .card.soon .thumb {
    display: flex;
    align-items: center;
    justify-content: center;
    border: 1px dashed var(--line);
    background: transparent;
    aspect-ratio: 3 / 2;
  }

  .card.soon .soon-text {
    color: var(--muted);
    font-size: 0.85rem;
    letter-spacing: 0.4em;
  }

  /* ---------- footer ---------- */
  footer {
    text-align: center;
    padding: 3rem 1.5rem 4rem;
    color: var(--muted);
    font-size: 0.8rem;
    letter-spacing: 0.18em;
    border-top: 1px solid var(--line);
  }

  footer span { color: var(--accent); }
</style>
</head>
<body>

<header class="hero">
  <p class="kicker">Collections</p>
  <h1>摄影集</h1>
  <p class="sub">记录走过的路，看过的光</p>
  <div class="rule"></div>
</header>

<main class="grid" id="grid"></main>

<footer>
  <span>✦</span> 摄影作品集 <span>✦</span>
</footer>

<script>
  const albums = [
    {
      title: "昌平",
      sub: "风景",
      desc: "山野与光影",
      cover: "昌平/DSC02942.jpg",
      count: 7,
      link: "昌平/changping.html"
    }
  ];

  const grid = document.getElementById("grid");

  albums.forEach((a, i) => {
    const card = document.createElement("a");
    card.className = "card";
    card.href = a.link;
    card.innerHTML = `
      <div class="thumb">
        <img src="${a.cover}" alt="${a.title} ${a.sub}" loading="lazy">
        <div class="shade"></div>
        <span class="index">${String(i + 1).padStart(2, "0")}</span>
      </div>
      <div class="info">
        <div>
          <h2>${a.title} <em>${a.sub}</em></h2>
          <p class="desc">${a.desc}</p>
          <p class="meta">${a.count} 张作品</p>
        </div>
        <span class="enter">进入 <span class="arrow">→</span></span>
      </div>`;
    grid.appendChild(card);
  });

  const soon = document.createElement("div");
  soon.className = "card soon";
  soon.innerHTML = `
    <div class="thumb"><span class="soon-text">敬请期待</span></div>
    <div class="info">
      <div><h2><em>更多摄影集</em></h2><p class="desc">正在筹备中</p></div>
    </div>`;
  grid.appendChild(soon);

  const io = new IntersectionObserver((entries) => {
    entries.forEach(e => {
      if (e.isIntersecting) {
        e.target.classList.add("revealed");
        io.unobserve(e.target);
      }
    });
  }, { threshold: 0.15 });

  document.querySelectorAll(".card").forEach(c => io.observe(c));
</script>
</body>
</html>
